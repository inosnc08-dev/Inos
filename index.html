<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>InosChat - Random Video Chat</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #f1f5f9;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            height: 60px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Country Picker Button */
        .country-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .country-btn:hover {
            border-color: var(--accent-green);
        }

        /* Modal ne Qender per Shtetet */
        .country-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .country-modal.active {
            display: flex;
        }

        .country-modal-content {
            background: var(--bg-primary);
            width: 100%;
            max-width: 420px;
            height: 80vh;
            max-height: 550px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            animation: modalScaleIn 0.2s ease-out;
        }

        @keyframes modalScaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .country-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
        }

        .country-modal-close {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .country-search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .country-search-box input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .country-search-box input:focus {
            border-color: var(--accent-green);
        }

        .country-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .country-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s;
        }

        .country-item:hover {
            background: var(--bg-card);
        }

        .country-item.selected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
        }

        .country-flag {
            font-size: 18px;
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--accent-green);
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .online-badge.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }

        /* Layout Grid */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            height: calc(100dvh - 60px - 75px);
            overflow: hidden;
        }

        /* Video Area */
        .video-container {
            position: relative;
            background: #090d16;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        .video-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #remoteVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        #localVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }

        /* Animacioni i kërkimit te kamera e tjetrit */
        .video-overlay-status {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
            text-align: center;
            gap: 20px;
            border-radius: 12px;
        }

        .epic-loader {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .epic-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top-color: var(--accent-green);
            border-bottom-color: #ffffff;
            border-radius: 50%;
            animation: epicSpin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .epic-ring:nth-child(2) {
            width: 60px;
            height: 60px;
            border-top-color: #38bdf8;
            border-bottom-color: var(--accent-green);
            animation-direction: reverse;
            animation-duration: 0.9s;
        }

        @keyframes epicSpin {
            0% { transform: rotate(0deg) scale(0.95); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(0.95); }
        }

        .video-overlay-status h3 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
        }

        /* Chat Panel */
        .chat-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            background: var(--bg-secondary);
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.3;
            word-break: break-word;
        }

        .message.received {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .message.sent {
            background: var(--accent-green);
            color: white;
            align-self: flex-end;
        }

        .chat-input-box {
            padding: 10px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .chat-input-box input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .chat-input-box input:focus {
            border-color: var(--accent-green);
        }

        .btn-send {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Bottom Controls Bar */
        .controls-bar {
            height: 75px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 15px;
        }

        .ctrl-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        .ctrl-btn.active-state {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        .btn-action {
            padding: 0 24px;
            height: 42px;
            border-radius: 21px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #startBtn { background: var(--accent-green); display: inline-flex; }
        #stopBtn { background: var(--accent-green); display: none; }
        #skipBtn { background: var(--accent-green); display: none; }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 180px;
                height: calc(100dvh - 60px - 70px);
            }
            .video-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                padding: 5px;
            }
            .controls-bar { height: 70px; gap: 8px; }
            .ctrl-btn { width: 38px; height: 38px; font-size: 14px; }
            .btn-action { padding: 0 18px; height: 38px; font-size: 13px; }
        }
    </style>
</head>

            { code: 'TH', name: 'Thailand', flag: '🇹🇭' },
            { code: 'UA', name: 'Ukraine', flag: '🇺🇦' },
            { code: 'AE', name: 'United Arab Emirates', flag: '🇦🇪' },
            { code: 'UY', name: 'Uruguay', flag: '🇺🇾' },
            { code: 'UZ', name: 'Uzbekistan', flag: '🇺🇿' },
            { code: 'VE', name: 'Venezuela', flag: '🇻🇪' },
            { code: 'VN', name: 'Vietnam', flag: '🇻🇳' }
        ];

        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        const localVideo = document.getElementById("localVideo");
        const remoteVideo = document.getElementById("remoteVideo");
        const videoOverlay = document.getElementById("videoOverlay");
        const statusTitle = document.getElementById("statusTitle");
        const onlineBadge = document.getElementById("onlineBadge");
        
        const openCountryModal = document.getElementById("openCountryModal");
        const closeCountryModal = document.getElementById("closeCountryModal");
        const countryModal = document.getElementById("countryModal");
        const countryListContainer = document.getElementById("countryListContainer");
        const countrySearchInput = document.getElementById("countrySearchInput");
        const selectedCountryLabel = document.getElementById("selectedCountryLabel");

        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const skipBtn = document.getElementById("skipBtn");
        const btnMic = document.getElementById("btnMic");
        const btnCam = document.getElementById("btnCam");

        const chatMessages = document.getElementById("chatMessages");
        const chatInput = document.getElementById("chatInput");
        const sendBtn = document.getElementById("sendBtn");
        const onlineCount = document.getElementById("onlineCount");

        function renderCountries(filter = '') {
            countryListContainer.innerHTML = '';
            const filtered = countriesList.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(c => {
                const div = document.createElement("div");
                div.className = `country-item ${selectedCountryCode === c.code ? 'selected' : ''}`;
                div.innerHTML = `<span class="country-flag">${c.flag}</span> <span>${c.name}</span>`;
                div.onclick = () => {
                    selectedCountryCode = c.code;
                    selectedCountryLabel.innerHTML = `<span class="country-flag">${c.flag}</span> <span>${c.name}</span>`;
                    countryModal.classList.remove("active");
                };
                countryListContainer.appendChild(div);
            });
        }

        openCountryModal.onclick = () => {
            renderCountries();
            countryModal.classList.add("active");
            countrySearchInput.value = '';
            countrySearchInput.focus();
        };

        closeCountryModal.onclick = () => {
            countryModal.classList.remove("active");
        };

        countryModal.onclick = (e) => {
            if (e.target === countryModal) countryModal.classList.remove("active");
        };

        countrySearchInput.oninput = (e) => {
            renderCountries(e.target.value);
        };

        async function updatePresence() {
            if (!db) return;
            try {
                const userRef = doc(db, "presence", currentUserId);
                await setDoc(userRef, { lastSeen: serverTimestamp() });
                
                setInterval(async () => {
                    try { await updateDoc(userRef, { lastSeen: serverTimestamp() }); } catch(e){}
                }, 5000);

                onSnapshot(collection(db, "presence"), snap => {
                    const now = Date.now();
                    let activeCount = 0;
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.lastSeen) {
                            const timeDiff = now - data.lastSeen.toMillis();
                            if (timeDiff < 15000) activeCount++;
                        } else {
                            activeCount++;
                        }
                    });
                    onlineCount.textContent = `${Math.max(1, activeCount)} online`;
                });
            } catch(e) {}
        }
        updatePresence();

        function setHomeState(isHome) {
            if (isHome) {
                onlineBadge.classList.remove("hidden");
                openCountryModal.style.display = "flex";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "none";
                skipBtn.style.display = "none";
            } else {
                onlineBadge.classList.add("hidden");
                openCountryModal.style.display = "none";
                startBtn.style.display = "none";
            }
        }

        async function getMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: { 
                    echoCancellation: true, 
                    noiseSuppression: true, 
                    autoGainControl: true 
                } 
            });
            localVideo.srcObject = localStream;
            btnMic.disabled = false;
            btnCam.disabled = false;
        }

        let isMuted = false;
        btnMic.addEventListener("click", () => {
            if(!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            btnMic.classList.toggle("active-state", isMuted);
            btnMic.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
        });

        let isCamOff = false;
        btnCam.addEventListener("click", () => {
            if(!localStream) return;
            isCamOff = !isCamOff;
            localStream.getVideoTracks()[0].enabled = !isCamOff;
            btnCam.classList.toggle("active-state", isCamOff);
            btnCam.innerHTML = isCamOff ? '<i class="fa-solid fa-video-slash"></i>' : '<i class="fa-solid fa-camera"></i>';
        });

        startBtn.addEventListener("click", async () => {
            try {
                await getMedia();
                startSearch();
            } catch(e) { alert("Camera access denied."); }
        });

        stopBtn.addEventListener("click", async () => {
            await cleanupSession();
            setStatus("", false);
            setHomeState(true);
        });

        skipBtn.addEventListener("click", async () => {
            await cleanupSession();
            await getMedia();
            startSearch();
        });

        function startSearch() {
            isSearching = true;
            setHomeState(false);
            stopBtn.style.display = "inline-flex";
            skipBtn.style.display = "inline-flex";
            setStatus("Searching...", true);
            findMatch();
        }

        async function findMatch() {
            if (!isSearching || !db) return;
            try {
                const waitingRef = collection(db, "waiting");
                const snap = await getDocs(query(waitingRef));
                let partner = null;

                for (let d of snap.docs) {
                    const data = d.data();
                    if (data.uid !== currentUserId) {
                        // Logika e saktë: Përputhet vetëm nëse të dy kanë zgjedhur të njëjtin shtet ose njëri/të dy kanë Worldwide ('all')
                        const myCountry = selectedCountryCode;
                        const peerCountry = data.country || 'all';

                        if (myCountry === 'all' || peerCountry === 'all' || myCountry === peerCountry) {
                            partner = data;
                            break;
                        }
                    }
                }

                if (partner) {
                    partnerId = partner.uid;
                    await deleteDoc(doc(db, "waiting", partnerId));
                    const roomId = `room_${Math.min(currentUserId.charCodeAt(0), partnerId.charCodeAt(0))}_${Date.now()}`;
                    currentRoomId = roomId;

                    await setDoc(doc(db, "rooms", roomId), {
                        user1: partnerId, user2: currentUserId, status: "active"
                    });
                    setupRTC(roomId, true);
                } else {
                    await setDoc(doc(db, "waiting", currentUserId), { 
                        uid: currentUserId, 
                        country: selectedCountryCode 
                    });
                    waitForPartner();
                }
            } catch(e) {}
        }

        function waitForPartner() {
            if (!db) return;
            const q = query(collection(db, "rooms"));
            roomUnsub = onSnapshot(q, snap => {
                snap.forEach(r => {
                    const data = r.data();
                    if (data.user1 === currentUserId && data.status === "active") {
                        currentRoomId = r.id;
                        partnerId = data.user2;
                        if(waitingUnsub) waitingUnsub();
                        deleteDoc(doc(db, "waiting", currentUserId)).catch(()=>{});
                        setupRTC(currentRoomId, false);
                    }
                });
            });
        }

        async function setupRTC(roomId, isInitiator) {
            isSearching = false;
            isConnected = true;
            setHomeState(false);
            setStatus("Searching...", true);

            peerConnection = new RTCPeerConnection(rtcConfig);
            
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            peerConnection.ontrack = e => {
                if(!remoteStream) {
                    remoteStream = new MediaStream();
                    remoteVideo.srcObject = remoteStream;
                }
                
                if (!remoteStream.getTracks().includes(e.track)) {
                    remoteStream.addTrack(e.track);
                }

                remoteVideo.play().catch(() => {});

                setStatus("", false);
                chatInput.disabled = false;
                sendBtn.disabled = false;
                
                stopBtn.style.display = "inline-flex";
                skipBtn.style.display = "inline-flex";

                listenChat(roomId);
            };

            peerConnection.onicecandidate = e => {
                if(e.candidate) addSig(roomId, { type: 'ice', candidate: e.candidate.toJSON(), sender: currentUserId });
            };

            peerConnection.onconnectionstatechange = () => {
                if(peerConnection && ['disconnected', 'failed', 'closed'].includes(peerConnection.connectionState)) {
                    handleDisconnect();
                }
            };

            if(isInitiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                addSig(roomId, { type: 'offer', sdp: offer.sdp, sender: currentUserId });
            }
            listenSig(roomId, isInitiator);
        }

        async function addSig(roomId, data) {
            if (!db) return;
            await addDoc(collection(db, "rooms", roomId, "signals"), { ...data, time: serverTimestamp() });
        }

        function listenSig(roomId, isInitiator) {
            if (!db) return;
            sigUnsub = onSnapshot(collection(db, "rooms", roomId, "signals"), async snap => {
                snap.docChanges().forEach(async change => {
                    if(change.type === "added") {
                        const d = change.doc.data();
                        if(d.sender === currentUserId) return;
                        try {
                            if(d.type === 'offer' && !isInitiator) {
                                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: d.sdp }));
                                const ans = await peerConnection.createAnswer();
                                await peerConnection.setLocalDescription(ans);
                                addSig(roomId, { type: 'answer', sdp: ans.sdp, sender: currentUserId });
                            } else if(d.type === 'answer' && isInitiator) {
                                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: d.sdp }));
                            } else if(d.type === 'ice' && d.candidate) {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate));
                            }
                        } catch(err) {}
                    }
                });
            });
        }

        function listenChat(roomId) {
            if (!db) return;
            processedMsgIds.clear();
            msgUnsub = onSnapshot(collection(db, "rooms", roomId, "messages"), snap => {
                snap.docChanges().forEach(c => {
                    if(c.type === "added") {
                        const msgId = c.doc.id;
                        if (processedMsgIds.has(msgId)) return;
                        processedMsgIds.add(msgId);
                        
                        const m = c.doc.data();
                        appendMsg(m.text, m.senderId === currentUserId);
                    }
                });
            });
        }

        function appendMsg(text, isSent) {
            const div = document.createElement("div");
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener("click", sendMsg);
        chatInput.addEventListener("keypress", e => { if(e.key === "Enter") sendMsg(); });

        async function sendMsg() {
            const txt = chatInput.value.trim();
            if(!txt || !currentRoomId || !db) return;
            chatInput.value = "";
            await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
                senderId: currentUserId, text: txt, time: serverTimestamp()
            });
        }

        function handleDisconnect() {
            if(!isConnected) return;
            setStatus("Searching...", true);
            cleanupPC();
            skipBtn.click();
        }

        async function cleanupSession() {
            isSearching = false;
            isConnected = false;
            partnerId = null;

            if(waitingUnsub) waitingUnsub();
            if(roomUnsub) roomUnsub();
            if(msgUnsub) msgUnsub();
            if(sigUnsub) sigUnsub();

            if (db) {
                await deleteDoc(doc(db, "waiting", currentUserId)).catch(()=>{});
                if(currentRoomId) {
                    await setDoc(doc(db, "rooms", currentRoomId), { status: "closed" }, { merge: true }).catch(()=>{});
                    currentRoomId = null;
                }
            }

            cleanupPC();

            if(localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                localVideo.srcObject = null;
            }
            remoteVideo.srcObject = null;
            chatMessages.innerHTML = "";
            chatInput.disabled = true;
            sendBtn.disabled = true;
            btnMic.disabled = true;
            btnCam.disabled = true;
        }

        function cleanupPC() {
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteStream = null;
        }

        function setStatus(title, showOverlay) {
            statusTitle.textContent = title;
            videoOverlay.style.display = showOverlay ? "flex" : "none";
        }
    </script>
</body>
</html>
